name: publish

# Add a new cron line here when a future show needs a different schedule.
# Each run gates every show through src/due.js, so a show only publishes when
# its OWN config cron matches the current hour + weekday.
on:
  schedule:
    - cron: "0 11 * * 1,4" # unread-shelf-en: Mon + Thu, 11:00 UTC
  workflow_dispatch:
    inputs:
      show:
        description: "Show slug to run"
        default: "unread-shelf-en"
        required: true
      force:
        description: "Run even if not scheduled now (true/false)"
        default: "true"
        required: false

permissions:
  contents: write # needed to commit MP3 + feed.xml back to the repo

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        show: [unread-shelf-en] # add future show slugs here
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install deps
        run: npm ci || npm install

      - name: Gate on schedule
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET="${{ github.event.inputs.show }}"
            if [ "$TARGET" != "${{ matrix.show }}" ]; then
              echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            FORCE="--force"
            [ "${{ github.event.inputs.force }}" = "true" ] || FORCE=""
            node src/due.js --show=${{ matrix.show }} $FORCE && echo "run=true" >> "$GITHUB_OUTPUT" || echo "run=false" >> "$GITHUB_OUTPUT"
          else
            node src/due.js --show=${{ matrix.show }} && echo "run=true" >> "$GITHUB_OUTPUT" || echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate + publish episode
        if: steps.gate.outputs.run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          SITE_BASE_URL: ${{ secrets.SITE_BASE_URL }}
        run: node src/run.js --show=${{ matrix.show }}
